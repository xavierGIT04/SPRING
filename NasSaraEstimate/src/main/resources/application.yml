spring:
  application:
    name: estimation-immobiliere
  profiles:
    active: dev
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nassara_estimation}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
nassara:
  catalogue:
    url: https://nassarraimmobilier.com/notre-catalogue/
    delai-secondes: 10
    duree-cache-minutes: 5
  cors:
    origines: http://localhost:4200
  parametres:
    initialiser-courants: true